name: Repair moderator loading

on:
  push:
    branches: [main]

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repair dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/modules/moderator-dashboard.js')
          s = p.read_text()
          old = "    await Promise.all([this.loadClasses(), this.loadUsers(), this.loadStudents()]);\n    this.bindNavigation();\n    this.tab = window.location.hash.replace('#', '') || 'overview';\n    this.render();"
          new = "    const results = await Promise.allSettled([this.loadClasses(), this.loadUsers(), this.loadStudents()]);\n    const failures = results.filter(result => result.status === 'rejected');\n    if (failures.length) showNotification('Some dashboard data could not be loaded. Available sections are still shown.', 'warning');\n    this.bindNavigation();\n    this.tab = window.location.hash.replace('#', '') || 'overview';\n    this.render();"
          if old in s: s = s.replace(old, new, 1)
          old2 = "  async loadClasses() { this.classes = await getClasses(); }\n  async loadUsers() { this.users = await getAllUsers(); }\n  async loadStudents() { this.students = await getStudents(); }"
          new2 = "  async loadClasses() { try { this.classes = await getClasses(); } catch (error) { console.error('Moderator: failed to load classes', error); this.classes = []; throw error; } }\n  async loadUsers() { try { this.users = await getAllUsers(); } catch (error) { console.error('Moderator: failed to load users', error); this.users = []; throw error; } }\n  async loadStudents() { try { this.students = await getStudents(); } catch (error) { console.error('Moderator: failed to load students', error); this.students = []; throw error; } }"
          if old2 in s: s = s.replace(old2, new2, 1)
          old3 = "    const main = document.getElementById('moderatorContent');\n    clearElement(main);"
          new3 = "    const main = document.getElementById('moderatorContent');\n    if (!main) { console.error('Moderator dashboard container #moderatorContent was not found.'); return; }\n    clearElement(main);"
          if old3 in s: s = s.replace(old3, new3, 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/fix-moderator-dashboard.yml .github/workflows/repair-moderator-loading.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/moderator-dashboard.js .github/workflows/fix-moderator-dashboard.yml .github/workflows/repair-moderator-loading.yml
          git commit -m "fix: make moderator dashboard render despite data load failures"
          git push origin main
