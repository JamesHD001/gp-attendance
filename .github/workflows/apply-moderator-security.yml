name: Apply moderator role security

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/apply-moderator-security.py'
      - '.github/workflows/apply-moderator-security.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply moderator role security changes
        run: python3 scripts/apply-moderator-security.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/modules/auth.js firestore.rules
          if git diff --cached --quiet; then
            echo "No security changes to commit."
            exit 0
          fi
          git commit -m "feat: enable moderator authentication and attendance security"
          git push origin HEAD:main
