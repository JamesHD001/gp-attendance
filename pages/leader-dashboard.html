<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#0066cc">
        <title>Leader Dashboard - YSA GP Attendance System</title>
        <link rel="stylesheet" href="../css/styles.css">
        <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="admin-dashboard-page">
    <div class="dashboard-shell">
        <button class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Toggle navigation menu">
            <div class="mobile-nav-toggle-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </button>

        <div class="mobile-nav-backdrop" id="mobileNavBackdrop"></div>

        <nav class="sidebar admin-sidebar" id="adminSidebar" aria-label="Leader navigation">
            <div class="sidebar-brand">
                <div>
                    <div class="brand-mark" aria-hidden="true">YSA</div>
                </div>
                <div>
                    <div class="brand-title">Leader</div>
                    <div class="brand-subtitle">Dashboard</div>
                </div>
                <button class="mobile-sidebar-close" id="mobileSidebarClose" aria-label="Close navigation menu">×</button>
            </div>

            <div class="sidebar-section-label">Navigation</div>
            <ul class="nav">
                <li class="nav-item"><a href="#overview" class="nav-link active" data-tab="overview"><span data-lucide="home"></span> <span>Dashboard</span></a></li>
                <li class="nav-item"><a href="#classes" class="nav-link" data-tab="classes"><span data-lucide="book-open"></span> <span>Classes</span></a></li>
                <li class="nav-item"><a href="#reports" class="nav-link" data-tab="reports"><span data-lucide="file-text"></span> <span>Reports</span></a></li>
                <li class="nav-item"><a href="#analytics" class="nav-link" data-tab="analytics"><span data-lucide="bar-chart-3"></span> <span>Analytics</span></a></li>
                <li class="nav-item"><a href="#graduation" class="nav-link" data-tab="graduation"><span data-lucide="graduation-cap"></span> <span>Graduation</span></a></li>
                <li class="nav-item"><a href="#graduands" class="nav-link" data-tab="graduands"><span data-lucide="award"></span> <span>Graduands</span></a></li>
                <li class="nav-item"><a href="#settings" class="nav-link" data-tab="settings"><span data-lucide="settings"></span> <span>Settings</span></a></li>
            </ul>

            <div class="sidebar-bottom">
                <button id="logoutBtn" class="sidebar-nav-action" type="button"><span data-lucide="log-out" style="width: 16px; height: 16px; display: inline-block; margin-right: 8px;"></span>Logout</button>
            </div>
        </nav>

        <div class="dashboard-main-area">
            <header class="dashboard-topbar">
                <div>
                    <div class="topbar-kicker">The Church of Jesus Christ of Latter-day Saints</div>
                    <div class="topbar-title">IJEBU-ODE Stake YSA GP — Leader Dashboard</div>
                </div>
                <span id="datetime" class="topbar-time"></span>
            </header>

            <main class="main-content">
                <!-- Content populated by JavaScript -->
            </main>

            <footer class="footer">
                <p>&copy; 2026 IJEBU-ODE STAKE YSA GP</p>
            </footer>
        </div>
    </div>

    <!-- BUG FIX: live clock -->
    <script>
        function updateClock() {
            const el = document.getElementById('datetime');
            if (el) el.textContent = new Date().toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });
        }
        updateClock();
        setInterval(updateClock, 60000);

        // Initialize Lucide icons
        if (window.lucide) {
            window.lucide.createIcons();
        }
    </script>

    <script type="module">
        import { LeaderDashboard } from '../js/modules/leader-dashboard.js';
        import { initTheme } from '../js/modules/theme.js';

        initTheme();

        const dashboard = new LeaderDashboard();
        dashboard.init();

        // Mobile navigation handlers
        const mobileNavToggle = document.getElementById('mobileNavToggle');
        const mobileSidebarClose = document.getElementById('mobileSidebarClose');
        const adminSidebar = document.getElementById('adminSidebar');
        const mobileNavBackdrop = document.getElementById('mobileNavBackdrop');

        function closeMobileSidebar() {
            adminSidebar.classList.remove('show');
            mobileNavBackdrop.classList.remove('show');
        }

        function openMobileSidebar() {
            adminSidebar.classList.add('show');
            mobileNavBackdrop.classList.add('show');
        }

        mobileNavToggle?.addEventListener('click', () => {
            if (adminSidebar.classList.contains('show')) {
                closeMobileSidebar();
            } else {
                openMobileSidebar();
            }
        });

        mobileSidebarClose?.addEventListener('click', closeMobileSidebar);
        mobileNavBackdrop?.addEventListener('click', closeMobileSidebar);

        // Close sidebar when navigating
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                setTimeout(closeMobileSidebar, 100);
            });
        });

        // Re-initialize Lucide icons after each dashboard render
        const originalRenderDashboard = dashboard.renderDashboard;
        dashboard.renderDashboard = function() {
            originalRenderDashboard.call(this);
            if (window.lucide) {
                window.lucide.createIcons();
            }
        };
    </script>
</body>
</html>
