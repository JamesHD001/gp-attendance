<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Henry Daniel James">
    <title>Admin Dashboard - YSA GP Attendance System</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <span>THE CHURCH OF JESUS CHRIST OF LATTER DAY SAINTS | IJEBU-ODE STAKE YSA GP ATTENDANCE SYSTEM</span>
        </div>
    </header>
    <div class="page-wrapper">
        <nav class="sidebar">
            <h2 style="color: var(--primary-blue); margin-bottom: var(--spacing-xl);">YSA</h2>
            <ul class="nav">
                <li class="nav-item nav-item-dashboard">
                    <a id="dashboardNavToggle" href="#overview" class="nav-link nav-link-toggle active" aria-expanded="true" aria-controls="dashboardSubmenu">
                        <span>Dashboard</span>
                        <span class="nav-caret">v</span>
                    </a>
                    <ul id="dashboardSubmenu" class="nav-submenu">
                        <li class="nav-subitem"><a href="#overview" class="nav-sublink active" data-tab="overview">Overview</a></li>
                        <li class="nav-subitem"><a href="#classes" class="nav-sublink" data-tab="classes">Classes</a></li>
                        <li class="nav-subitem"><a href="#graduation" class="nav-sublink" data-tab="graduation">Graduation</a></li>
                        <li class="nav-subitem"><a href="#students" class="nav-sublink" data-tab="students">Students</a></li>
                    </ul>
                </li>
                <li class="nav-item"><a href="#settings" class="nav-link" data-tab="settings">Settings</a></li>
                <li class="nav-item"><a href="#users" class="nav-link" data-tab="users">Users</a></li>
                <li class="nav-item"><a href="#analytics" class="nav-link" data-tab="analytics">Analytics</a></li>
                <li class="nav-item nav-item-logout"><button id="logoutBtn" class="sidebar-nav-action" type="button">Logout</button></li>
            </ul>
        </nav>

        <main class="main-content">
            <!-- Content populated by JavaScript -->
        </main>
    </div>

    <footer class="footer">
        <p>&copy; 2026 IJEBU-ODE STAKE YSA GP</p>
        <span id="datetime"></span>
    </footer>

    <!-- BUG FIX: live clock — was defined in HTML but never populated -->
    <script>
        function updateClock() {
            const el = document.getElementById('datetime');
            if (el) el.textContent = new Date().toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });
        }
        updateClock();
        setInterval(updateClock, 60000);
    </script>

    <script type="module">
        import { AdminDashboard } from '../js/modules/admin-dashboard.js';
        const dashboard = new AdminDashboard();
        dashboard.init();
    </script>
</body>
</html>
