<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Henry Daniel James">
    <title>Admin Dashboard - YSA GP Attendance System</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="admin-dashboard-page">
    <div class="dashboard-shell">
        <button class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Toggle navigation menu">
            <div class="mobile-nav-toggle-icon">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </button>

        <div class="mobile-nav-backdrop" id="mobileNavBackdrop"></div>

        <nav class="sidebar admin-sidebar" id="adminSidebar" aria-label="Admin navigation">
            <div class="sidebar-brand">
                <div>
                    <div class="brand-mark" aria-hidden="true">GP</div>
                </div>
                <div>
                    <div class="brand-title">YSA GP</div>
                    <div class="brand-subtitle">Admin Console</div>
                </div>
                <button class="sidebar-collapse-toggle" id="sidebarCollapseBtn" type="button" aria-label="Collapse sidebar" aria-expanded="true" title="Collapse sidebar">
                    <span data-lucide="panel-left-close"></span>
                </button>
                <button class="mobile-sidebar-close" id="mobileSidebarClose" aria-label="Close navigation menu">×</button>
            </div>

            <div class="sidebar-section-label">Workspace</div>
            <ul class="nav">
                <li class="nav-item nav-item-dashboard">
                    <a id="dashboardNavToggle" href="#dashboardSubmenu" role="button" class="nav-link nav-link-toggle active" aria-expanded="true" aria-controls="dashboardSubmenu">
                        <span class="nav-icon" data-lucide="layout-dashboard"></span>
                        <span class="nav-label">Dashboard</span>
                        <span class="nav-caret">v</span>
                    </a>
                    <ul id="dashboardSubmenu" class="nav-submenu">
                        <li class="nav-subitem"><a href="#overview" class="nav-sublink active" data-tab="overview"><span class="nav-icon" data-lucide="home"></span><span class="nav-label">Overview</span></a></li>
                        <li class="nav-subitem"><a href="#classes" class="nav-sublink" data-tab="classes"><span class="nav-icon" data-lucide="book-open"></span><span class="nav-label">Classes</span></a></li>
                        <li class="nav-subitem"><a href="#graduation" class="nav-sublink" data-tab="graduation"><span class="nav-icon" data-lucide="graduation-cap"></span><span class="nav-label">Graduation</span></a></li>
                        <li class="nav-subitem"><a href="#students" class="nav-sublink" data-tab="students"><span class="nav-icon" data-lucide="users"></span><span class="nav-label">Students</span></a></li>
                    </ul>
                </li>
                <li class="nav-item"><a href="#analytics" class="nav-link" data-tab="analytics"><span class="nav-icon" data-lucide="bar-chart-3"></span><span class="nav-label">Analytics</span></a></li>
                <li class="nav-item"><a href="#users" class="nav-link" data-tab="users"><span class="nav-icon" data-lucide="users-round"></span><span class="nav-label">Users</span></a></li>
                <li class="nav-item"><a href="#settings" class="nav-link" data-tab="settings"><span class="nav-icon" data-lucide="settings"></span><span class="nav-label">Settings</span></a></li>
            </ul>

            <div class="sidebar-bottom">
                <button id="logoutBtn" class="sidebar-nav-action" type="button"><span class="nav-icon" data-lucide="log-out"></span><span class="nav-label">Logout</span></button>
            </div>
        </nav>

        <div class="dashboard-main-area">
            <header class="dashboard-topbar">
                <div>
                    <div class="topbar-kicker">The Church of Jesus Christ of Latter-day Saints</div>
                    <div class="topbar-title">IJEBU-ODE Stake YSA GP Attendance System</div>
                </div>
                <span id="datetime" class="topbar-time"></span>
            </header>

            <main class="main-content">
                <!-- Content populated by JavaScript -->
            </main>

            <footer class="footer">
                <p>&copy; 2026 IJEBU-ODE STAKE YSA GP</p>
            </footer>
        </div>
    </div>

    <!-- BUG FIX: live clock — was defined in HTML but never populated -->
    <script>
        function updateClock() {
            const el = document.getElementById('datetime');
            if (el) el.textContent = new Date().toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' });
        }
        updateClock();
        setInterval(updateClock, 60000);

        // Initialize Lucide icons
        if (window.lucide) {
            window.lucide.createIcons();
        }
    </script>

    <script type="module">
        import { AdminDashboard } from '../js/modules/admin-dashboard.js';
        const dashboard = new AdminDashboard();
        dashboard.init();

        // Mobile navigation handlers
        const mobileNavToggle = document.getElementById('mobileNavToggle');
        const mobileSidebarClose = document.getElementById('mobileSidebarClose');
        const adminSidebar = document.getElementById('adminSidebar');
        const mobileNavBackdrop = document.getElementById('mobileNavBackdrop');

        function closeMobileSidebar() {
            adminSidebar.classList.remove('show');
            mobileNavBackdrop.classList.remove('show');
        }

        function openMobileSidebar() {
            adminSidebar.classList.add('show');
            mobileNavBackdrop.classList.add('show');
        }

        mobileNavToggle?.addEventListener('click', () => {
            if (adminSidebar.classList.contains('show')) {
                closeMobileSidebar();
            } else {
                openMobileSidebar();
            }
        });

        mobileSidebarClose?.addEventListener('click', closeMobileSidebar);
        mobileNavBackdrop?.addEventListener('click', closeMobileSidebar);

        // Close sidebar when navigating
        document.querySelectorAll('.nav-link, .nav-sublink').forEach(link => {
            link.addEventListener('click', () => {
                setTimeout(closeMobileSidebar, 100);
            });
        });

        // Re-initialize Lucide icons after each dashboard render
        const originalRenderDashboard = dashboard.renderDashboard;
        dashboard.renderDashboard = function() {
            originalRenderDashboard.call(this);
            if (window.lucide) {
                window.lucide.createIcons();
            }
        };
    </script>
</body>
</html>
